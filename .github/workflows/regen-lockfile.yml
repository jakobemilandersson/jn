name: Regen lockfile

on:
  push:
    branches:
      - feat/issue-50-react-router-nav

permissions:
  contents: write

jobs:
  regen:
    name: pnpm install & commit lockfile
    runs-on: ubuntu-latest
    # Only run when this workflow file itself is present on the branch
    if: |
      contains(github.event.head_commit.message, 'regen-lockfile') == false &&
      contains(github.event.head_commit.message, 'regenerate pnpm-lock') == false &&
      contains(github.event.head_commit.message, 'remove one-off regen') == false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-50-react-router-nav
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install (no frozen lockfile)
        run: pnpm install --no-frozen-lockfile

      - name: Commit updated lockfile
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet && echo "lockfile unchanged" && exit 0
          git commit -m "chore: regenerate pnpm-lock.yaml"
          git push

      - name: Delete this workflow file
        run: |
          git pull --rebase
          git rm .github/workflows/regen-lockfile.yml
          git commit -m "ci: remove one-off regen-lockfile workflow"
          git push
