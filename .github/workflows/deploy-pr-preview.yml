name: Deploy PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v2

      - run: pnpm install --frozen-lockfile

      - name: Build with PR base path
        run: pnpm build
        env:
          VITE_BASE_PATH: /pull/${{ github.event.pull_request.number }}/

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Deploy preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: pull/${{ github.event.pull_request.number }}
          clean: false

      # The gh-pages branch needs a CNAME at its root so jakob.now resolves
      # to it. Production uses actions/deploy-pages (artifact-based) which is
      # a separate system and never touches gh-pages, so we must write the
      # CNAME ourselves. We do it after every preview deploy to ensure it
      # survives even if the branch was recreated.
      - name: Ensure CNAME on gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .cname-root
          target-folder: /
          clean: false
        env:
          # Trick: write the CNAME file into a temp dir and deploy it to root
          _: |
            mkdir -p .cname-root
            echo "jakob.now" > .cname-root/CNAME

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://jakob.now/pull/${prNumber}/`;
            const body = `### 🔍 PR Preview\n\nA preview of this PR is available at:\n${previewUrl}\n\n> Built from commit ${{ github.sha }}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🔍 PR Preview')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
