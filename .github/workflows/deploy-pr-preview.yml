name: Deploy PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v2

      - run: pnpm install --frozen-lockfile

      # Build with a PR-specific base path so all asset URLs resolve correctly
      # under /jn/pull/<pr-number>/
      - name: Build with PR base path
        run: pnpm build
        env:
          VITE_BASE_PATH: /jn/pull/${{ github.event.pull_request.number }}/

      # Checkout gh-pages branch (or create it) and write the preview into
      # pull/<pr-number>/ without touching anything else in the branch.
      - name: Deploy preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: pull/${{ github.event.pull_request.number }}
          # Do NOT clean — we only want to write into the target subfolder
          clean: false

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://jakobemilandersson.github.io/jn/pull/${prNumber}/`;
            const body = `### 🔍 PR Preview\n\nA preview of this PR is available at:\n${previewUrl}\n\n> Built from commit ${{ github.sha }}`;

            // Look for an existing preview comment and update it, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🔍 PR Preview')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
